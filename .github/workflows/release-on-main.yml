name: Publish changed Marketplace versions

on:
  push:
    branches: [main]

permissions:
  attestations: read
  contents: read

concurrency:
  group: convax-marketplace-release
  cancel-in-progress: false

env:
  CONVAX_PLUGIN_API_CATALOG: node_modules/@convax/plugin-api/dist/generated/plugin-api.json

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      count: ${{ steps.plan.outputs.count }}
      plugin_count: ${{ steps.plan.outputs.plugin_count }}
    steps:
      - name: Check out protected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install inert workspace dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- bun.lock
      - name: Fetch the current production closure
        run: bun tooling/fetch-marketplace-previous.mjs
      - name: Fetch and verify the pinned official FFmpeg source
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null 2>&1; then
            brew install gnupg
          fi
          source_path="$RUNNER_TEMP/ffmpeg-8.1.2.tar.xz"
          signature_path="$source_path.asc"
          key_path="$RUNNER_TEMP/ffmpeg-devel.asc"
          download() {
            curl \
              --connect-timeout 20 \
              --fail \
              --location \
              --max-time 240 \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --silent \
              --show-error \
              "$1" \
              --output "$2"
          }
          download https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz "$source_path"
          download https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz.asc "$signature_path"
          download https://ffmpeg.org/ffmpeg-devel.asc "$key_path"
          test "$(stat -f '%z' "$source_path")" = "11710924"
          test "$(shasum -a 256 "$source_path" | awk '{print $1}')" = "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c"
          test "$(stat -f '%z' "$signature_path")" = "520"
          test "$(shasum -a 256 "$signature_path" | awk '{print $1}')" = "0a0963fccd70597838073f3e31b20f4a4d8cc2b5e577472c9a5a1f22624246f8"
          test "$(stat -f '%z' "$key_path")" = "1709"
          test "$(shasum -a 256 "$key_path" | awk '{print $1}')" = "397b3becedcd5a98769967ff1ff8501ddc89f8368b8f766e4701377d7dbaabe5"
          export GNUPGHOME="$RUNNER_TEMP/ffmpeg-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import "$key_path"
          fingerprint="$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "FCF986EA15E6E293A5644F10B4322F04D67658D8"
          gpg --batch --verify "$signature_path" "$source_path"
          echo "CONVAX_FFMPEG_SOURCE_ARCHIVE=$source_path" >> "$GITHUB_ENV"
          echo "CONVAX_FFMPEG_SOURCE_SIGNATURE=$signature_path" >> "$GITHUB_ENV"
          echo "CONVAX_FFMPEG_SIGNING_KEY=$key_path" >> "$GITHUB_ENV"
          echo "CONVAX_FFMPEG_REQUIRE_PGP=1" >> "$GITHUB_ENV"
      - name: Build deterministic version-selection inputs
        run: |
          bun run workspaces:build:packages
          bun run build:companions
      - name: Select exact unpublished version changes
        id: plan
        run: |
          cutover_args=()
          if [[ -n "${CONVAX_MARKETPLACE_CUTOVER_PREVIOUS:-}" ]]; then
            cutover_args+=(--cutover-registry "$CONVAX_MARKETPLACE_CUTOVER_PREVIOUS")
          fi
          bun tooling/marketplace-release.mjs \
            --base "$CONVAX_MARKETPLACE_BASE_SHA" \
            --catalog "$CONVAX_PLUGIN_API_CATALOG" \
            "${cutover_args[@]}" \
            --governance-base "${{ github.event.before }}" \
            --head "$GITHUB_SHA" \
            --omissions-output dist/release-omissions.json \
            --output dist/release-plan.json
          echo "count=$(jq length dist/release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "plugin_count=$(jq '[.[] | select(.kind == "plugin")] | length' dist/release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "CONVAX_MARKETPLACE_CHANGED=dist/release-plan.json" >> "$GITHUB_ENV"
      - name: Install Cosign
        if: steps.plan.outputs.plugin_count != '0'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Validate and build immutable release inputs
        run: bun run check
      - name: Require an npm-only frozen Plugin SDK closure
        if: steps.plan.outputs.plugin_count != '0'
        run: >-
          bun tooling/plugin-sdk-provenance-cli.mjs inspect-lock
          --api-install node_modules/@convax/plugin-api
          --bunfig bunfig.toml
          --lock bun.lock
          --output dist/plugin-sdk-frozen-lock.json
          --package package.json
          --sdk-install node_modules/@convax/plugin-sdk
      - name: Fetch and verify immutable Host package evidence
        if: steps.plan.outputs.plugin_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_REPOSITORY: microvoid/convax
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-sdk-provenance"
          mkdir -p \
            "$evidence/sdk-release" \
            "$evidence/api-release" \
            "$evidence/sdk-sigstore" \
            "$evidence/api-sigstore" \
            "$evidence/actual"
          gh api "repos/$HOST_REPOSITORY" > "$evidence/host-repository.json"
          sdk_version="$(jq -r '.dependencies[] | select(.name == "@convax/plugin-sdk") | .version' dist/plugin-sdk-frozen-lock.json)"
          api_version="$(jq -r '.dependencies[] | select(.name == "@convax/plugin-api") | .version' dist/plugin-sdk-frozen-lock.json)"
          [[ "$sdk_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$api_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          sdk_refs="$evidence/sdk-refs.json"
          gh api "repos/$HOST_REPOSITORY/git/matching-refs/tags/plugin-sdk-v$sdk_version-" > "$sdk_refs"
          test "$(jq '[.[] | select(.object.type == "commit") | select(.ref | test("^refs/tags/plugin-sdk-v'"$sdk_version"'-[a-f0-9]{40}$"))] | length' "$sdk_refs")" = 1
          sdk_tag="$(jq -r '.[] | select(.object.type == "commit") | select(.ref | test("^refs/tags/plugin-sdk-v'"$sdk_version"'-[a-f0-9]{40}$")) | .ref | sub("^refs/tags/"; "")' "$sdk_refs")"
          sdk_commit="$(jq -r '.[] | select(.ref == "refs/tags/'"$sdk_tag"'") | .object.sha' "$sdk_refs")"
          test "$sdk_tag" = "plugin-sdk-v$sdk_version-$sdk_commit"
          gh api \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$HOST_REPOSITORY/releases/tags/$sdk_tag" > "$evidence/sdk-release.json"
          jq -e \
            --arg commit "$sdk_commit" \
            --arg tag "$sdk_tag" \
            '.tag_name == $tag and .target_commitish == $commit and .draft == false and .immutable == true' \
            "$evidence/sdk-release.json" >/dev/null
          gh release verify "$sdk_tag" --repo "$HOST_REPOSITORY" --format json >/dev/null
          gh release download "$sdk_tag" --repo "$HOST_REPOSITORY" --dir "$evidence/sdk-release"
          test "$(find "$evidence/sdk-release" -maxdepth 1 -type f -name 'convax-plugin-sdk-*.tgz' | wc -l | tr -d ' ')" = 1
          test -f "$evidence/sdk-release/convax-plugin-sdk-$sdk_version.tgz"
          test -f "$evidence/sdk-release/host-package-release.json"
          test -f "$evidence/sdk-release/plugin-api.json"
          test -f "$evidence/sdk-release/SHA256SUMS"
          (
            cd "$evidence/sdk-release"
            shasum -a 256 -c SHA256SUMS
          )
          sdk_baseline_api="$(jq -r '.dependencies[0].resolvedVersion' "$evidence/sdk-release/host-package-release.json")"
          test -f "$evidence/sdk-release/convax-plugin-api-$sdk_baseline_api.tgz"
          expected_sdk_assets='["SHA256SUMS","SHA256SUMS.sigstore.json","convax-plugin-api-'"$sdk_baseline_api"'.tgz","convax-plugin-api-'"$sdk_baseline_api"'.tgz.sigstore.json","convax-plugin-sdk-'"$sdk_version"'.tgz","convax-plugin-sdk-'"$sdk_version"'.tgz.sigstore.json","host-package-release.json","host-package-release.json.sigstore.json","plugin-api.json","plugin-api.json.sigstore.json"]'
          test "$(find "$evidence/sdk-release" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | jq -Rsc 'split("\n")[:-1]')" = "$expected_sdk_assets"
          for asset in "$evidence/sdk-release"/*; do
            gh release verify-asset "$sdk_tag" "$asset" --repo "$HOST_REPOSITORY" --format json >/dev/null
          done
          sdk_workflow="$HOST_REPOSITORY/.github/workflows/plugin-sdk-release.yml@refs/heads/convax-next"
          for asset_name in \
            "SHA256SUMS" \
            "convax-plugin-api-$sdk_baseline_api.tgz" \
            "convax-plugin-sdk-$sdk_version.tgz" \
            "host-package-release.json" \
            "plugin-api.json"; do
            asset="$evidence/sdk-release/$asset_name"
            bundle="$asset.sigstore.json"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "https://github.com/$sdk_workflow" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$HOST_REPOSITORY" \
              --certificate-github-workflow-ref refs/heads/convax-next \
              --certificate-github-workflow-sha "$sdk_commit" \
              --certificate-github-workflow-trigger workflow_dispatch \
              "$asset" >/dev/null
            bun tooling/host-sigstore-bundle.mjs \
              --asset "$asset" \
              --bundle "$bundle" \
              --commit "$sdk_commit" \
              --output "$evidence/sdk-sigstore/$asset_name.json" \
              --repository-metadata "$evidence/host-repository.json" \
              --trigger workflow_dispatch \
              --workflow-ref "$sdk_workflow"
          done
          test "$(find "$evidence/sdk-sigstore" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5
          for verification in "$evidence/sdk-sigstore"/*.json; do
            jq -e \
              --arg commit "$sdk_commit" \
              '.schema == "convax.host-sigstore-verification/1" and
               .certificate.sourceRepositoryDigest == $commit and
               .certificate.runnerEnvironment == "github-hosted" and
               .certificate.trigger == "workflow_dispatch" and
               .hostIdentity.repository.id == "1293264965" and
               .hostIdentity.owner.id == "125447777"' \
              "$verification" >/dev/null
          done

          api_refs="$evidence/api-refs.json"
          gh api "repos/$HOST_REPOSITORY/git/matching-refs/tags/plugin-api-v$api_version-" > "$api_refs"
          test "$(jq '[.[] | select(.object.type == "commit") | select(.ref | test("^refs/tags/plugin-api-v'"$api_version"'-[a-f0-9]{40}$"))] | length' "$api_refs")" = 1
          api_tag="$(jq -r '.[] | select(.object.type == "commit") | select(.ref | test("^refs/tags/plugin-api-v'"$api_version"'-[a-f0-9]{40}$")) | .ref | sub("^refs/tags/"; "")' "$api_refs")"
          api_commit="$(jq -r '.[] | select(.ref == "refs/tags/'"$api_tag"'") | .object.sha' "$api_refs")"
          test "$api_tag" = "plugin-api-v$api_version-$api_commit"
          gh api \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$HOST_REPOSITORY/releases/tags/$api_tag" > "$evidence/api-release.json"
          jq -e \
            --arg commit "$api_commit" \
            --arg tag "$api_tag" \
            '.tag_name == $tag and .target_commitish == $commit and .draft == false and .immutable == true' \
            "$evidence/api-release.json" >/dev/null
          gh release verify "$api_tag" --repo "$HOST_REPOSITORY" --format json >/dev/null
          gh release download "$api_tag" --repo "$HOST_REPOSITORY" --dir "$evidence/api-release"
          expected_api_assets='["SHA256SUMS","SHA256SUMS.sigstore.json","convax-plugin-api-'"$api_version"'.tgz","convax-plugin-api-'"$api_version"'.tgz.sigstore.json","plugin-api.json","plugin-api.json.sigstore.json","runtime-conformance.json","runtime-conformance.json.sigstore.json"]'
          test "$(find "$evidence/api-release" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | jq -Rsc 'split("\n")[:-1]')" = "$expected_api_assets"
          (
            cd "$evidence/api-release"
            shasum -a 256 -c SHA256SUMS
          )
          for asset in "$evidence/api-release"/*; do
            gh release verify-asset "$api_tag" "$asset" --repo "$HOST_REPOSITORY" --format json >/dev/null
          done
          api_workflow="$HOST_REPOSITORY/.github/workflows/plugin-api-release.yml@refs/heads/convax-next"
          for asset_name in \
            "SHA256SUMS" \
            "convax-plugin-api-$api_version.tgz" \
            "plugin-api.json" \
            "runtime-conformance.json"; do
            asset="$evidence/api-release/$asset_name"
            bundle="$asset.sigstore.json"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "https://github.com/$api_workflow" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$HOST_REPOSITORY" \
              --certificate-github-workflow-ref refs/heads/convax-next \
              --certificate-github-workflow-sha "$api_commit" \
              --certificate-github-workflow-trigger workflow_dispatch \
              "$asset" >/dev/null
            bun tooling/host-sigstore-bundle.mjs \
              --asset "$asset" \
              --bundle "$bundle" \
              --commit "$api_commit" \
              --output "$evidence/api-sigstore/$asset_name.json" \
              --repository-metadata "$evidence/host-repository.json" \
              --trigger workflow_dispatch \
              --workflow-ref "$api_workflow"
          done
          test "$(find "$evidence/api-sigstore" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          for verification in "$evidence/api-sigstore"/*.json; do
            jq -e \
              --arg commit "$api_commit" \
              '.schema == "convax.host-sigstore-verification/1" and
               .certificate.sourceRepositoryDigest == $commit and
               .certificate.runnerEnvironment == "github-hosted" and
               .certificate.trigger == "workflow_dispatch" and
               .hostIdentity.repository.id == "1293264965" and
               .hostIdentity.owner.id == "125447777"' \
              "$verification" >/dev/null
          done

          curl --fail --silent --show-error \
            --max-filesize 1048576 \
            "https://registry.npmjs.org/@convax%2fplugin-sdk/$sdk_version" \
            --output "$evidence/sdk-npm.json"
          curl --fail --silent --show-error \
            --max-filesize 1048576 \
            "https://registry.npmjs.org/@convax%2fplugin-api/$api_version" \
            --output "$evidence/api-npm.json"
          sdk_url="$(jq -r '.dist.tarball' "$evidence/sdk-npm.json")"
          api_url="$(jq -r '.dist.tarball' "$evidence/api-npm.json")"
          test "$sdk_url" = "https://registry.npmjs.org/@convax/plugin-sdk/-/plugin-sdk-$sdk_version.tgz"
          test "$api_url" = "https://registry.npmjs.org/@convax/plugin-api/-/plugin-api-$api_version.tgz"
          curl --fail --location --silent --show-error --max-filesize 33554432 \
            "$sdk_url" --output "$evidence/actual/plugin-sdk.tgz"
          curl --fail --location --silent --show-error --max-filesize 33554432 \
            "$api_url" --output "$evidence/actual/plugin-api.tgz"
          cmp "$evidence/actual/plugin-sdk.tgz" "$evidence/sdk-release/convax-plugin-sdk-$sdk_version.tgz"
          cmp "$evidence/actual/plugin-api.tgz" "$evidence/api-release/convax-plugin-api-$api_version.tgz"
          test "sha512-$(openssl dgst -sha512 -binary "$evidence/actual/plugin-sdk.tgz" | base64 | tr -d '\n')" = \
            "$(jq -r '.dist.integrity' "$evidence/sdk-npm.json)"
          test "sha512-$(openssl dgst -sha512 -binary "$evidence/actual/plugin-api.tgz" | base64 | tr -d '\n')" = \
            "$(jq -r '.dist.integrity' "$evidence/api-npm.json)"
          mkdir "$evidence/installed-sdk" "$evidence/installed-api"
          tar -xzf "$evidence/actual/plugin-sdk.tgz" -C "$evidence/installed-sdk"
          tar -xzf "$evidence/actual/plugin-api.tgz" -C "$evidence/installed-api"
          diff -qr \
            "$evidence/installed-sdk/package" \
            "$(realpath node_modules/@convax/plugin-sdk)"
          diff -qr \
            "$evidence/installed-api/package" \
            "$(realpath node_modules/@convax/plugin-api)"

          tar -xOzf "$evidence/actual/plugin-sdk.tgz" package/package.json > "$evidence/sdk-package.json"
          tar -xOzf "$evidence/actual/plugin-api.tgz" package/package.json > "$evidence/api-package.json"
          tar -xOzf "$evidence/sdk-release/convax-plugin-api-$sdk_baseline_api.tgz" package/package.json > "$evidence/sdk-release-api-package.json"
          tar -xOzf "$evidence/sdk-release/convax-plugin-api-$sdk_baseline_api.tgz" package/dist/generated/plugin-api.json > "$evidence/sdk-release-api-catalog.json"
          cmp "$evidence/sdk-release-api-catalog.json" "$evidence/sdk-release/plugin-api.json"
          cmp "$evidence/api-release/plugin-api.json" \
            <(tar -xOzf "$evidence/actual/plugin-api.tgz" package/dist/generated/plugin-api.json)

          jq -n \
            --arg commit "$sdk_commit" \
            --arg tag "$sdk_tag" \
            '{
              repository: "microvoid/convax",
              commit: $commit,
              tag: $tag,
              workflowRef: "microvoid/convax/.github/workflows/plugin-sdk-release.yml@refs/heads/convax-next"
            }' > "$evidence/sdk-release-identity.json"
          jq -n \
            --arg commit "$api_commit" \
            --arg tag "$api_tag" \
            '{
              repository: "microvoid/convax",
              commit: $commit,
              tag: $tag,
              workflowRef: "microvoid/convax/.github/workflows/plugin-api-release.yml@refs/heads/convax-next"
            }' > "$evidence/api-release-identity.json"
          echo "CONVAX_PLUGIN_SDK_PROVENANCE=$evidence" >> "$GITHUB_ENV"
      - name: Bind every selected Plugin ZIP to its actual SDK/API closure
        if: steps.plan.outputs.plugin_count != '0'
        run: >-
          bun tooling/plugin-sdk-provenance-cli.mjs build
          --api-catalog "$CONVAX_PLUGIN_SDK_PROVENANCE/api-release/plugin-api.json"
          --api-metadata "$CONVAX_PLUGIN_SDK_PROVENANCE/api-npm.json"
          --api-package-json "$CONVAX_PLUGIN_SDK_PROVENANCE/api-package.json"
          --api-release "$CONVAX_PLUGIN_SDK_PROVENANCE/api-release-identity.json"
          --api-runtime-conformance "$CONVAX_PLUGIN_SDK_PROVENANCE/api-release/runtime-conformance.json"
          --api-tarball "$CONVAX_PLUGIN_SDK_PROVENANCE/actual/plugin-api.tgz"
          --catalog-plan dist/catalog/release-plan.json
          --commit "$GITHUB_SHA"
          --frozen-lock dist/plugin-sdk-frozen-lock.json
          --output dist/plugin-sdk-provenance.json
          --sdk-host-package-release "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-release/host-package-release.json"
          --sdk-metadata "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-npm.json"
          --sdk-package-json "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-package.json"
          --sdk-release "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-release-identity.json"
          --sdk-release-api-catalog "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-release-api-catalog.json"
          --sdk-release-api-package-json "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-release-api-package.json"
          --sdk-release-api-tarball "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-release/convax-plugin-api-$(jq -r '.dependencies[0].resolvedVersion' "$CONVAX_PLUGIN_SDK_PROVENANCE/sdk-release/host-package-release.json").tgz"
          --sdk-tarball "$CONVAX_PLUGIN_SDK_PROVENANCE/actual/plugin-sdk.tgz"
          --selected dist/release-plan.json
      - name: Re-verify provenance-augmented release inputs
        if: steps.plan.outputs.plugin_count != '0'
        run: bun tooling/verify-marketplace-output.mjs dist/catalog
      - name: Stage verified FFmpeg source and SBOM beside the companion
        if: env.CONVAX_FFMPEG_REQUIRE_PGP == '1'
        run: |
          set -euo pipefail
          tag="$(jq -r '.[] | select(.kind == "plugin" and .id == "ffmpeg-tools") | .releaseTag' dist/release-plan.json)"
          test -n "$tag"
          package_dir="dist/catalog/releases/$tag"
          companion_path="$(find "$package_dir" -maxdepth 1 -type f -name '*-convax-ffmpeg-mcp' -print -quit)"
          test -n "$companion_path"
          cp "$CONVAX_FFMPEG_SOURCE_ARCHIVE" "$package_dir/convax-source-ffmpeg-8.1.2.tar.xz"
          cp "$CONVAX_FFMPEG_SOURCE_SIGNATURE" "$package_dir/convax-source-ffmpeg-8.1.2.tar.xz.asc"
          cp "$CONVAX_FFMPEG_SIGNING_KEY" "$package_dir/convax-source-ffmpeg-signing-key.asc"
          cp packages/tools/ffmpeg-mcp/FFMPEG-LICENSE "$package_dir/convax-ffmpeg-LGPL-2.1.txt"
          cp packages/tools/ffmpeg-mcp/THIRD_PARTY_NOTICES.md "$package_dir/convax-ffmpeg-THIRD-PARTY-NOTICES.md"
          tar -xOf "$CONVAX_FFMPEG_SOURCE_ARCHIVE" ffmpeg-8.1.2/LICENSE.md > "$package_dir/convax-ffmpeg-LICENSE.md"
          tar -xOf "$CONVAX_FFMPEG_SOURCE_ARCHIVE" ffmpeg-8.1.2/CREDITS > "$package_dir/convax-ffmpeg-CREDITS"
          release_revision="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [ -z "$release_revision" ]; then
            release_revision="$GITHUB_SHA"
          else
            git merge-base --is-ancestor "$release_revision" "$GITHUB_SHA"
          fi
          release_epoch="$(git show -s --format=%ct "$release_revision")"
          SOURCE_DATE_EPOCH="$release_epoch" bun packages/tools/ffmpeg-mcp/scripts/build-sbom.ts \
            --companion "$companion_path" \
            --output "$package_dir/convax-ffmpeg-sbom.spdx.json" \
            --revision "$release_revision" \
            --tag "$tag"
      - name: Compose the exact publication plan
        run: bun tooling/publication-plan.mjs
      - name: Checksum the complete artifact-only publication candidate
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find builtin/releases catalog/releases -type f -print |
              LC_ALL=C sort |
              while IFS= read -r asset; do
                shasum -a 256 "$asset"
              done > PUBLICATION-SHA256SUMS
            if [ -f plugin-sdk-provenance.json ]; then
              shasum -a 256 plugin-sdk-provenance.json >> PUBLICATION-SHA256SUMS
            fi
          )
      - name: Upload verified exact bytes
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: marketplace-release-${{ github.sha }}
          path: |
            dist/builtin
            dist/catalog
            dist/product-lock-input.json
            dist/plugin-sdk-provenance.json
            dist/PUBLICATION-SHA256SUMS
            dist/publication-plan.json
            dist/release-omissions.json
            dist/release-plan.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: plugin-marketplace-production
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified exact bytes
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: marketplace-release-${{ github.sha }}
          path: dist
      - name: Re-verify the complete candidate without repository code
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            if find builtin/releases catalog/releases -mindepth 1 ! -type f ! -type d -print -quit |
              grep -q .; then
              echo "Publication candidate contains a non-file Release entry" >&2
              exit 1
            fi
            if grep -Ev \
              '^[a-f0-9]{64}  (builtin/releases/|catalog/releases/|plugin-sdk-provenance\.json$)' \
              PUBLICATION-SHA256SUMS |
              grep -q .; then
              echo "Publication checksum manifest contains an unsafe path" >&2
              exit 1
            fi
            sha256sum --check PUBLICATION-SHA256SUMS
            expected_checksum_count="$(
              find builtin/releases catalog/releases -type f | wc -l | tr -d ' '
            )"
            if [ -f plugin-sdk-provenance.json ]; then
              expected_checksum_count="$((expected_checksum_count + 1))"
            fi
            test "$(wc -l < PUBLICATION-SHA256SUMS | tr -d ' ')" = \
              "$expected_checksum_count"
          )
          if [ -f dist/plugin-sdk-provenance.json ]; then
            expected_plugins="$(jq '[.[] | select(.kind == "plugin")] | length' dist/release-plan.json)"
            test "$(jq '.statements | length' dist/plugin-sdk-provenance.json)" = "$expected_plugins"
            jq -e \
              --arg commit "$GITHUB_SHA" \
              '
                .schema == "convax.plugin-bundle-provenance-index/1" and
                .sourceCommit == $commit and
                (.frozenLockSha256 | test("^[a-f0-9]{64}$")) and
                (.statements | type == "array") and
                ([.statements[].path] | unique | length) == (.statements | length) and
                all(.statements[];
                  (.plugin | keys) == ["id", "version"] and
                  (.path | test("^catalog/releases/plugin-[a-z0-9-]+-v[0-9]+\\.[0-9]+\\.[0-9]+/convax-plugin-[a-z0-9-]+-[0-9]+\\.[0-9]+\\.[0-9]+\\.provenance\\.json$")) and
                  (.sha256 | test("^[a-f0-9]{64}$"))
                )
              ' dist/plugin-sdk-provenance.json >/dev/null
            while IFS= read -r statement_path; do
              statement="dist/$statement_path"
              test -f "$statement"
              statement_sha="$(sha256sum "$statement" | awk '{ print $1 }')"
              test "$statement_sha" = \
                "$(jq -r --arg path "$statement_path" '.statements[] | select(.path == $path) | .sha256' dist/plugin-sdk-provenance.json)"
              canonical="$RUNNER_TEMP/$(basename "$statement").canonical"
              jq -cS . "$statement" > "$canonical"
              cmp "$statement" "$canonical"
              jq -e \
                --arg commit "$GITHUB_SHA" \
                '
                  keys == ["frozenLock", "hostReleases", "output", "schema", "source"] and
                  .schema == "convax.plugin-bundle-provenance/1" and
                  (.source | keys) == ["buildEntrypoints", "commit", "plugin", "repository"] and
                  .source.repository == "microvoid/convax-plugins" and
                  .source.commit == $commit and
                  (.source.plugin | keys) == ["id", "packageManifestSha256", "version", "workspace"] and
                  .source.plugin.workspace == ("packages/plugins/" + .source.plugin.id) and
                  (.source.plugin.packageManifestSha256 | test("^[a-f0-9]{64}$")) and
                  (.source.buildEntrypoints | length >= 1 and length <= 2) and
                  all(.source.buildEntrypoints[];
                    keys == ["command", "path", "sha256"] and
                    (.path | startswith("/") | not) and
                    (.path | contains("..") | not) and
                    (.sha256 | test("^[a-f0-9]{64}$"))
                  ) and
                  (.frozenLock | keys) == ["dependencies", "lockfile", "registry", "schema"] and
                  .frozenLock.schema == "convax.plugin-sdk-frozen-lock/1" and
                  .frozenLock.registry == "https://registry.npmjs.org" and
                  (.frozenLock.lockfile | keys) == ["path", "sha256"] and
                  .frozenLock.lockfile.path == "bun.lock" and
                  (.frozenLock.lockfile.sha256 | test("^[a-f0-9]{64}$")) and
                  [.frozenLock.dependencies[].name] == ["@convax/plugin-api", "@convax/plugin-sdk"] and
                  all(.frozenLock.dependencies[];
                    keys == ["name", "registryUrl", "tarballIntegrity", "tarballSha256", "version"] and
                    .registryUrl == (
                      "https://registry.npmjs.org/" + .name + "/-/" +
                      (.name | split("/")[1]) + "-" + .version + ".tgz"
                    ) and
                    (.tarballIntegrity | test("^sha512-[A-Za-z0-9+/]+={0,2}$")) and
                    (.tarballSha256 | test("^[a-f0-9]{64}$"))
                  ) and
                  (.hostReleases | keys) == ["pluginApi", "pluginSdk"] and
                  (.hostReleases.pluginApi | keys) == ["catalogSchema", "catalogSha256", "commit", "repository", "runAttempt", "runId", "tag", "workflowRef"] and
                  .hostReleases.pluginApi.repository == "microvoid/convax" and
                  .hostReleases.pluginApi.workflowRef == "microvoid/convax/.github/workflows/plugin-api-release.yml@refs/heads/convax-next" and
                  .hostReleases.pluginApi.catalogSchema == "convax.plugin-api-catalog/3" and
                  .hostReleases.pluginApi.tag == (
                    "plugin-api-v" + .frozenLock.dependencies[0].version + "-" +
                    .hostReleases.pluginApi.commit
                  ) and
                  (.hostReleases.pluginApi.catalogSha256 | test("^[a-f0-9]{64}$")) and
                  (.hostReleases.pluginApi.runId | test("^[1-9][0-9]*$")) and
                  (.hostReleases.pluginApi.runAttempt | test("^[1-9][0-9]*$")) and
                  (.hostReleases.pluginSdk | keys) == ["commit", "declaredApiRange", "releaseTimeApiVersion", "repository", "runAttempt", "runId", "tag", "workflowRef"] and
                  .hostReleases.pluginSdk.repository == "microvoid/convax" and
                  .hostReleases.pluginSdk.workflowRef == "microvoid/convax/.github/workflows/plugin-sdk-release.yml@refs/heads/convax-next" and
                  .hostReleases.pluginSdk.tag == (
                    "plugin-sdk-v" + .frozenLock.dependencies[1].version + "-" +
                    .hostReleases.pluginSdk.commit
                  ) and
                  (.hostReleases.pluginSdk.runId | test("^[1-9][0-9]*$")) and
                  (.hostReleases.pluginSdk.runAttempt | test("^[1-9][0-9]*$")) and
                  (.output | keys) == ["path", "sha256", "size"] and
                  .output.path == (
                    "catalog/releases/plugin-" + .source.plugin.id + "-v" +
                    .source.plugin.version + "/convax-plugin-" +
                    .source.plugin.id + "-" + .source.plugin.version + ".zip"
                  ) and
                  (.output.sha256 | test("^[a-f0-9]{64}$")) and
                  .output.size > 0
                ' "$statement" >/dev/null
              output_path="$(jq -r '.output.path' "$statement")"
              output_sha="$(jq -r '.output.sha256' "$statement")"
              test -f "dist/$output_path"
              test "$(sha256sum "dist/$output_path" | awk '{ print $1 }')" = "$output_sha"
              plugin_id="$(jq -r '.source.plugin.id' "$statement")"
              plugin_version="$(jq -r '.source.plugin.version' "$statement")"
              test "$(jq --arg id "$plugin_id" --arg version "$plugin_version" \
                '[.[] | select(.kind == "plugin" and .id == $id and .version == $version)] | length' \
                dist/release-plan.json)" = 1
            done < <(jq -r '.statements[].path' dist/plugin-sdk-provenance.json)
          fi
      - name: Attest immutable Plugin bundles, statements, and checksums together
        if: needs.verify.outputs.plugin_count != '0'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/**/releases/**
            dist/plugin-sdk-provenance.json
            dist/PUBLICATION-SHA256SUMS
      - name: Attest immutable non-Plugin packages and checksums
        if: needs.verify.outputs.plugin_count == '0'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/**/releases/**
            dist/PUBLICATION-SHA256SUMS
      - name: Publish each selected version once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.releases[]' dist/publication-plan.json | while read -r item; do
            tag="$(jq -r '.tag' <<<"$item")"
            package_dir="dist/$(jq -r '.directory' <<<"$item")"
            test -d "$package_dir"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release version reuse is forbidden: $tag" >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Tag version reuse is forbidden: $tag" >&2
              exit 1
            fi
            shopt -s nullglob
            assets=("$package_dir"/*)
            test "${#assets[@]}" -gt 0
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Deterministic Convax Marketplace package generated from protected main." \
              "${assets[@]}"
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" |
              jq -e \
                --arg commit "$GITHUB_SHA" \
                '.object.type == "commit" and .object.sha == $commit' >/dev/null
          done

  pages:
    needs: [verify, publish]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.publish.result == 'success'
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages.yml
