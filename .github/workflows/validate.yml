name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Retain protected pending Host capability requests on pull requests
        if: github.event_name == 'pull_request'
        run: bun tooling/host-capability-history.mjs --base "${{ github.event.pull_request.base.sha }}"
      - name: Retain protected pending Host capability requests on main
        if: github.event_name == 'push'
        run: bun tooling/host-capability-history.mjs --base "${{ github.event.before }}"
      - name: Validate, test, and reproduce packages
        run: bun run check
