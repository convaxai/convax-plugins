<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>剪映导入</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <main>
      <header>
        <span class="logo" aria-hidden="true">剪</span>
        <span><strong>剪映导入</strong><small id="scope">正在连接 Convax…</small></span>
        <span class="status" id="connection">等待宿主</span>
      </header>
      <section>
        <div class="title-row">
          <span><small>CANVAS INPUTS</small><h1>已连接素材</h1></span>
          <strong class="count" id="count">0</strong>
        </div>
        <p>将图片或视频节点直接连入此节点。只有点击导入后，宿主才会暂存并交给本机剪映。</p>
        <ol id="inputs"></ol>
        <p class="empty" id="empty">暂无可导入素材。</p>
      </section>
      <section class="actions">
        <button class="secondary" id="inspect" type="button" disabled>检查剪映</button>
        <button class="primary" id="export" type="button" disabled>导入已连接素材</button>
      </section>
      <output id="result">安装插件不会自动启动剪映，也不会上传素材到网络。</output>
    </main>
    <script src="assets/app.js"></script>
  </body>
</html>
